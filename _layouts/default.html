<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">RepeatWise</a>
    <nav>
      <a href="{{ '/guide/' | relative_url }}">User guide</a>
      <a href="{{ '/legal/privacy-policy.html' | relative_url }}">Privacy</a>
      <a href="{{ '/legal/eula.html' | relative_url }}">Terms (EULA)</a>
      <a href="{{ '/support.html' | relative_url }}">Support</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>RepeatWise is published by Cocoon Care LLC. Not affiliated with Atlassian; Jira is a trademark of Atlassian.</p>
    <p>
      <a href="{{ '/attribution.html' | relative_url }}">Third-party data</a> ·
      <a href="{{ '/legal/privacy-policy.html' | relative_url }}">Privacy</a> ·
      <a href="{{ '/legal/eula.html' | relative_url }}">Terms</a> ·
      <a href="{{ '/support.html' | relative_url }}">Support</a>
    </p>
    <p>This site sets no cookies and loads no scripts, fonts or analytics.</p>
  </footer>
</body>
</html>
